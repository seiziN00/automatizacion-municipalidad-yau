[project]
name = "ml-service"
version = "0.1.0"
description = "Clasificacion NLP de tramites municipales en PDF - Municipalidad Provincial de Yau"
readme = "README.md"
authors = [
    { name = "Luis-Tello", email = "kuru2Hate@outlook.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.34",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ml-service = "ml_service:main"
ml-train = "ml_service:train"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
